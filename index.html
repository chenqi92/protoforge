    <!-- Theme-first bootstrap moved to src/themeBootstrap.ts (first import in main.tsx) to satisfy a stricter script-src CSP that no longer allows inline scripts -->

      html, body { margin: 0; padding: 0; background: #eef0f3; color: #1a1d23; font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      html, body, #root { height: 100%; overflow: hidden; }

  </head>
